device: 'cuda:0'

## ========================================
## RMSteg 轻量化配置文件
## ========================================
## 本配置文件针对计算资源受限的场景进行了优化
## 主要目标：降低计算成本、减少显存占用、提升推理速度
##
## 核心优化策略：
## 1. 模型架构轻量化
##    - ViT深度: 2层 -> 1层 (减少50%层数)
##    - 隐藏维度: 768 -> 384 (减少50%参数)
##    - MLP维度: 2048 -> 1024 (减少50%参数)
##    - 流模块数: 4 -> 2 (减少50%计算)
##
## 2. 训练效率提升
##    - 启用混合精度训练(AMP)减少显存和加速计算
##    - 减小图像尺寸降低计算复杂度
##    - 增加批次大小提高GPU利用率
##
## 3. 预期性能
##    - 参数量减少约75%
##    - 计算量减少约80-85%
##    - 推理速度提升3-5倍
## ========================================

# 失真增强配置 - 模拟现实世界中的图像劣化
# 这些参数用于训练时对隐写图像添加各种失真，提高模型鲁棒性
distortion:
  bright: 0.3              # 亮度调整范围 [-0.3, +0.3]
  hue: 0.1                 # 色调偏移范围 [-0.1, +0.1]
  saturation: 1.0          # 饱和度调整倍数
  transition: 0.02         # 颜色过渡参数
  contrast_l: 0.5          # 对比度下限
  contrast_h: 1.5          # 对比度上限
  use_jpeg: True           # 是否应用JPEG压缩失真
  jpeg_quality: 60         # JPEG压缩质量 (1-100，越低压缩越强)
  noise: 0.07              # 高斯噪声强度
  blur_kernel_size: 7      # 模糊核大小 (必须为奇数)


# 数据集路径配置
# 注意：路径使用通配符*匹配所有文件
data:
  train_img_dir: 'D:/datasets/coco/train2017/*'  # 训练用封面图像目录 (推荐使用COCO数据集)
  train_qr_dir: 'D:/datasets/qr_code/v5_new/*'   # 训练用QR码图像目录 (QR码版本5: 37x37模块)

# 训练超参数配置
train:
  cuda_devices: '0, 1, 2, 3'  # 使用的GPU设备ID列表 (支持多GPU训练)
  batch_size: 8               # 每个GPU的批次大小 (轻量化模型可使用更大批次)
  img_size: 128               # 输入图像尺寸 (从224降至128，减少67%像素，大幅降低计算量)
  eps: !!float 1e-6           # 数值稳定性参数，防止除零
  weight_decay: !!float 1e-5  # L2正则化系数，防止过拟合
  betas1: 0.9                 # Adam优化器的beta1参数 (一阶矩估计的指数衰减率)
  betas2: 0.999               # Adam优化器的beta2参数 (二阶矩估计的指数衰减率)
  optim_step: 1               # 学习率衰减的步长 (每optim_step个epoch衰减一次)
  optim_gamma: 1.0            # 学习率衰减系数 (gamma=1.0表示不衰减)
  save_freq: 1                # 模型保存频率 (每save_freq个epoch保存一次)
  epoch_num: 30               # 总训练轮数
  lr: 0.00001                 # 初始学习率 (建议范围: 1e-5 到 1e-4)
  use_gan: False              # 是否使用GAN进行对抗训练 (可提升视觉质量但增加训练时间)
  
  # ========== 轻量化训练专用参数 ==========
  use_mixed_precision: True   # 启用自动混合精度训练 (FP16+FP32)
                              # 优势: 减少50%显存占用，加速计算，几乎不损失精度
                              # 建议: 在所有支持的GPU上启用 (需要Volta架构及以上)
  
  gradient_accumulation_steps: 1  # 梯度累积步数
                                  # 用途: 在显存有限时模拟大批次训练
                                  # 示例: steps=2, batch_size=8 等效于 batch_size=16
                                  # 建议: 显存充足时保持为1
  
# 模型架构配置 - 轻量化版本
# 这些参数直接影响模型的容量和计算复杂度
model:
  # ========== 核心架构参数 ==========
  block_num: 2      # TransFlowBlock数量 (原始:4, 当前:2)
                    # 影响: 模型表达能力和计算复杂度
                    # 权衡: 更多块→更强能力但更慢
                    # 推荐范围: 1-4
  
  vit_depth: 1      # Vision Transformer的层数 (原始:2, 当前:1)
                    # 影响: 特征提取深度
                    # 权衡: 更深→更好特征但更慢
                    # 推荐范围: 1-2
  
  dim: 384          # 隐藏层维度/嵌入维度 (原始:768, 当前:384)
                    # 影响: 模型容量，参数量与dim²成正比
                    # 权衡: 更大→更强表达但显存和计算量激增
                    # 推荐范围: 256, 384, 512
  
  dim_mlp: 1024     # MLP (前馈网络) 的隐藏维度 (原始:2048, 当前:1024)
                    # 影响: 非线性变换能力
                    # 通常设置: dim_mlp = dim * (2~4)
                    # 推荐范围: 512, 1024, 1536
  
  latent_dim: 32    # 潜在空间维度 (原始:64, 当前:32)
                    # 影响: 图像编码的中间表示维度
                    # 权衡: 更大→更多信息保留但计算量增加
                    # 推荐范围: 16, 32, 48
  
  patch_size: 16    # ViT的patch尺寸 (保持不变)
                    # 影响: 图像分块大小，img_size必须能被patch_size整除
                    # 示例: img_size=128, patch_size=16 → 8×8=64个patches
                    # 推荐: 保持16 (标准ViT配置)
  
  # ========== 功能开关 ==========
  use_itf: True         # 是否使用可逆Token Shuffle (Invertible Token Flow)
                        # 作用: 增强QR码信息的隐藏效果
                        # 建议: 保持True以获得更好的隐写性能
  
  use_qr_trans: True    # 是否使用QR码变换 (ConvFlowBlock)
                        # 作用: 对QR码进行可逆卷积变换
                        # 建议: 保持True以提升QR码嵌入质量
  
  num_module: 37        # QR码的模块数 (Version 5 = 37×37模块)
                        # 注意: 必须与训练数据的QR码版本匹配
                        # QR码版本对照: V1=21, V2=25, V3=29, V4=33, V5=37
